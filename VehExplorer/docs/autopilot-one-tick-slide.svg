<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200">
  <rect width="1920" height="1200" fill="#f4f6f8"/>
  <text x="80" y="78" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#111827">One auto-pilot tick</text>
  <text x="80" y="128" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#374151">Only the first matching action runs. Then the next tick starts.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 1.2 L 10 5 L 0 8.8 Z" fill="#111827"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111827">
    <rect x="80" y="170" width="820" height="120" rx="16" fill="#e7f6ec" stroke="#1f7a4d" stroke-width="4"/>
    <text x="110" y="222" font-size="40" font-weight="700">Start of the tick</text>
    <text x="110" y="262" font-size="26">Checks happen from top to bottom</text>

    <rect x="80" y="340" width="820" height="130" rx="16" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text x="110" y="392" font-size="40" font-weight="700">p or q typed?</text>
    <text x="110" y="436" font-size="26">Keyboard check, before any action</text>

    <rect x="80" y="520" width="820" height="130" rx="16" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text x="110" y="572" font-size="40" font-weight="700">Already finished?</text>
    <text x="110" y="616" font-size="26">Mission over, goal met, energy floor, or a cap</text>

    <rect x="80" y="700" width="820" height="130" rx="16" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text x="110" y="752" font-size="40" font-weight="700">Shield under 2500?</text>
    <text x="110" y="796" font-size="26">And battery energy is still above 2500</text>

    <rect x="80" y="880" width="820" height="130" rx="16" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <text x="110" y="932" font-size="40" font-weight="700">A cell to scan?</text>
    <text x="110" y="976" font-size="26">Nearest unknown cell, radius 1 then 2</text>

    <rect x="1040" y="300" width="800" height="210" rx="16" fill="#fde8e8" stroke="#9b2c2c" stroke-width="4"/>
    <text x="1070" y="368" font-size="40" font-weight="700">Leave auto-pilot</text>
    <text x="1070" y="418" font-size="26">p returns to the manual prompt</text>
    <text x="1070" y="458" font-size="26">q goes on to the report</text>

    <rect x="1040" y="700" width="800" height="130" rx="16" fill="#e7f0ff" stroke="#1d4e89" stroke-width="4"/>
    <text x="1070" y="752" font-size="40" font-weight="700">Top up the shields</text>
    <text x="1070" y="796" font-size="26">One tenth of the battery, or half if that is under 1000</text>

    <rect x="1040" y="880" width="800" height="130" rx="16" fill="#e7f0ff" stroke="#1d4e89" stroke-width="4"/>
    <text x="1070" y="932" font-size="40" font-weight="700">Scan that one cell</text>
    <text x="1070" y="976" font-size="26">Cardinal directions before the diagonals</text>
  </g>

  <g fill="none" stroke="#111827" stroke-width="4" marker-end="url(#arrow)">
    <path d="M 490 290 L 490 340"/>
    <path d="M 490 470 L 490 520"/>
    <path d="M 490 650 L 490 700"/>
    <path d="M 490 830 L 490 880"/>
    <path d="M 900 405 L 1040 405"/>
    <path d="M 900 585 L 1040 450"/>
    <path d="M 900 765 L 1040 765"/>
    <path d="M 900 945 L 1040 945"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">
    <text x="500" y="328">no</text>
    <text x="500" y="508">no</text>
    <text x="500" y="688">no</text>
    <text x="500" y="868">no</text>
    <text x="930" y="390">yes</text>
    <text x="930" y="540">yes</text>
    <text x="930" y="750">yes</text>
    <text x="930" y="930">yes</text>
  </g>

  <text x="80" y="1060" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111827">If nothing is in range to scan</text>
  <text x="80" y="1108" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#374151">Take one safe cardinal step. If no step exists, stop: stuck / map exhausted.</text>
  <text x="80" y="1160" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#374151">After shield, scan, or move, wait the delay. p or q during that wait also leaves. Otherwise the next tick starts.</text>
</svg>
